<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="avT avD">
<title id="avT">Why it fits in a box</title>
<desc id="avD">Rack-scale GPU configurations need liquid cooling and a supporting plant; our accelerator racks are air-cooled, which is what makes a transportable module possible.</desc>
<defs>
  <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#000AFF"/></marker>
  <style>
    .s{font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    .h{font-weight:600;fill:#0000AF}.b{font-weight:600;fill:#14131A}.m{font-weight:400;fill:#4B4B66}
    .eT{font-weight:600;fill:#BE4200;letter-spacing:.1em}.eB{font-weight:600;fill:#000AFF;letter-spacing:.1em}
  </style>
</defs>
<rect width="900" height="700" fill="#F9F5EE"/>
<text class="s h" x="56" y="58" font-size="34">Why it fits in a box</text>
<text class="s m" x="56" y="90" font-size="19">The constraint doing more work here than any benchmark</text>
<line x1="56" y1="112" x2="844" y2="112" stroke="#E2DBCD" stroke-width="1"/>

<rect x="56" y="140" width="386" height="418" rx="10" fill="#FFFFFF" stroke="#E2DBCD" stroke-width="1.5"/>
<text class="s eT" x="84" y="178" font-size="14">RACK-SCALE GPU</text>
<text class="s b" x="84" y="212" font-size="26">Liquid required</text>
<g stroke="#BE4200" stroke-width="2.5" fill="none">
  <path d="M150 272 h-30 a14 14 0 0 0 -14 14 v42 a14 14 0 0 0 14 14 h30"/>
</g>
<rect x="150" y="250" width="78" height="112" rx="5" fill="#F9F5EE" stroke="#14131A" stroke-width="1.5"/>
<g stroke="#E2DBCD" stroke-width="1.5">
  <line x1="160" y1="276" x2="218" y2="276"/><line x1="160" y1="304" x2="218" y2="304"/><line x1="160" y1="332" x2="218" y2="332"/>
</g>
<path d="M228 282 h74 M228 330 h74" stroke="#BE4200" stroke-width="2.5" fill="none"/>
<rect x="302" y="274" width="92" height="64" rx="5" fill="#F9F5EE" stroke="#BE4200" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="s m" x="348" y="302" font-size="14" text-anchor="middle">cooling</text>
<text class="s m" x="348" y="320" font-size="14" text-anchor="middle">plant</text>
<text class="s m" x="84" y="412" font-size="19">1,400 W per GPU</text>
<text class="s m" x="84" y="442" font-size="19">Liquid at rack scale</text>
<text class="s m" x="84" y="472" font-size="19">No fully air-cooled NVL72</text>
<rect x="84" y="496" width="330" height="48" rx="6" fill="#FBEFE7"/>
<text class="s b" x="104" y="527" font-size="20" fill="#BE4200">A plumbing project.</text>

<rect x="458" y="140" width="386" height="418" rx="10" fill="#FFFFFF" stroke="#E2DBCD" stroke-width="1.5"/>
<text class="s eB" x="486" y="178" font-size="14">OUR MODULES</text>
<text class="s b" x="486" y="212" font-size="26">Air-cooled</text>
<g stroke="#000AFF" stroke-width="2.5" fill="none" marker-end="url(#fa)">
  <path d="M500 276 h58"/><path d="M500 306 h58"/><path d="M500 336 h58"/>
</g>
<rect x="576" y="250" width="78" height="112" rx="5" fill="#F9F5EE" stroke="#14131A" stroke-width="1.5"/>
<g stroke="#E2DBCD" stroke-width="1.5">
  <line x1="586" y1="276" x2="644" y2="276"/><line x1="586" y1="304" x2="644" y2="304"/><line x1="586" y1="332" x2="644" y2="332"/>
</g>
<g stroke="#000AFF" stroke-width="2.5" fill="none" marker-end="url(#fa)">
  <path d="M664 276 h58"/><path d="M664 306 h58"/><path d="M664 336 h58"/>
</g>
<text class="s m" x="486" y="412" font-size="19">~20 kW average per rack</text>
<text class="s m" x="486" y="442" font-size="19">Sealed air path, air-to-air exchange</text>
<text class="s m" x="486" y="472" font-size="19">No liquid loop, no water in the racks</text>
<rect x="486" y="496" width="330" height="48" rx="6" fill="#ECEDFF"/>
<text class="s b" x="506" y="527" font-size="20" fill="#000AFF">A product.</text>

<line x1="56" y1="606" x2="844" y2="606" stroke="#E2DBCD" stroke-width="1"/>
<text class="s m" x="56" y="638" font-size="16">NVIDIA GB300 NVL72 rack-scale configuration; SambaNova&#8217;s published SN50 rack average.</text>
<text class="s m" x="56" y="664" font-size="16">Compares <tspan font-weight="600">cooling requirements, not performance</tspan> &#8212; they are good at different halves of the job.</text>
</svg>
